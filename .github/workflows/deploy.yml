name: Refresh MAS data and deploy to GitHub Pages

# Runs on every push, by hand, and every weekday at 10:30 Singapore time (02:30 UTC): the MAS
# statistics API publishes T-bill results the evening of each auction and SSB results after each
# allotment. The data step writes src/data/{ssb,tbills,sora}.json; if anything changed, the files are
# committed back so the repository keeps the data the site was built with.
on:
  push:
    branches: ['main']
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Refresh MAS auction data
        run: node scripts/update-data.mjs
      - name: Engine and content tests (block a bad answer from the API)
        run: npx vitest run
      - name: Commit refreshed data
        run: |
          if ! git diff --quiet -- src/data; then
            git config user.name "data-refresh"
            git config user.email "actions@users.noreply.github.com"
            git add src/data
            git commit -m "Données MAS relues le $(date -u +%F)"
            git push
          fi
      - name: Build (with the snippet check)
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout (IndexNow script)
        uses: actions/checkout@v4
      - name: Ping IndexNow
        continue-on-error: true
        run: bash scripts/indexnow.sh
